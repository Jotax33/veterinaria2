<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Veterinaria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#138a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veterinaria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f6f8f7;
  --card: #ffffff;
  --text: #1b1f1d;
  --muted: #5d6762;
  --line: #d5dcd8;
  --primary: #138a55;
  --on-primary: #ffffff;
  --primary-soft: #e0f3ea;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --cuadro: #dbe8fb;
  --cuadro-borde: #8fb0e3;
  --dia: #ffefd6;
  --dia-borde: #f0c07a;
  --noche: #dfeafd;
  --noche-borde: #94b4e8;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111413;
    --card: #1b1f1d;
    --text: #e8ece9;
    --muted: #9aa5a0;
    --line: #333a37;
    --primary: #4cd98b;
    --on-primary: #06281a;
    --primary-soft: #1d3a2d;
    --danger: #ffb4ab;
    --danger-soft: #3b1f1c;
    --cuadro: #1b2c47;
    --cuadro-borde: #3d5e92;
    --dia: #3a2b14;
    --dia-borde: #8a6528;
    --noche: #1a2b48;
    --noche-borde: #3d5f95;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-top: env(safe-area-inset-top);
  padding-bottom: calc(68px + env(safe-area-inset-bottom));
}
main { max-width: 860px; margin: 0 auto; padding: 16px; }
#form { max-width: 640px; }
h1 { font-size: 1.5rem; margin: 4px 0 12px; }
h2 { font-size: 1.1rem; margin: 20px 0 8px; }

/* ---------- formularios ---------- */
.campo { display: block; margin-top: 14px; }
.campo > span, legend { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; padding: 0; }
input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%;
  font: inherit; font-size: 16px; /* 16px evita el zoom automático en iPhone */
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 12px;
  appearance: none; -webkit-appearance: none;
}
input[type=date] { min-height: 46px; }
textarea { resize: vertical; min-height: 84px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
input[aria-invalid=true], textarea[aria-invalid=true] { border-color: var(--danger); }
.fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fila3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
fieldset { border: 0; margin: 14px 0 0; padding: 0; min-width: 0; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 2px 0; cursor: pointer; }
.opt input { width: 22px; height: 22px; margin: 0; accent-color: var(--primary); flex: none; }
.sub { margin-left: 16px; padding-left: 12px; border-left: 3px solid var(--primary-soft); }
.err { display: block; color: var(--danger); font-size: .8rem; margin-top: 4px; }
.err[hidden] { display: none; }
.ayuda { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }

/* ---------- botones ---------- */
button {
  font: inherit; font-weight: 600;
  border-radius: 999px;
  padding: 11px 20px;
  border: 1px solid var(--primary);
  background: var(--primary); color: var(--on-primary);
  cursor: pointer;
}
button.sec { background: transparent; color: var(--primary); }
button.txt { background: transparent; border-color: transparent; color: var(--primary); padding: 8px 10px; }
button.peligro { background: transparent; border-color: transparent; color: var(--danger); padding: 8px 10px; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:active:not(:disabled) { transform: scale(.98); }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }

/* ---------- lista ---------- */
.barra { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 8px; }
.tarjeta {
  display: flex; gap: 8px; align-items: flex-start;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 12px 12px 14px; margin: 8px 0; cursor: pointer;
}
.tarjeta .info { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tarjeta .nombre { font-weight: 700; font-size: 1.05rem; }
.alerta { color: var(--danger); font-weight: 600; }
.vacio { color: var(--muted); }
details.respaldo { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
details.respaldo summary { cursor: pointer; font-weight: 600; min-height: 32px; }
details.respaldo p { color: var(--muted); font-size: .9rem; margin: 6px 0; }
.opcion-export { margin: 0 0 4px; }
#info-export { font-size: .85rem; margin: 0 0 12px; }

/* ---------- importar ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 14px 10px; margin: 6px 0 14px; }
.panel h2 { margin-top: 12px; }
.panel .opt small { color: var(--muted); }
.panel .nueva { color: var(--primary); font-weight: 600; }

/* ---------- detalle: cuadro azul ---------- */
.cuadro {
  background: var(--cuadro); border: 1px solid var(--cuadro-borde);
  border-radius: 28px; padding: 14px 22px 16px;
}
.cuadro-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cuadro-cab h1 { margin: 0; overflow-wrap: anywhere; }
.dato { padding: 6px 0; }
.dato .t { font-size: .78rem; font-weight: 600; color: var(--primary); }
.dato .v { white-space: pre-wrap; overflow-wrap: anywhere; }
.cuadro .datos { display: grid; grid-template-columns: 1fr; column-gap: 24px; margin-top: 6px; }
@media (min-width: 640px) { .cuadro .datos { grid-template-columns: 1fr 1fr; } }

/* ---------- detalle: bloques con botón ---------- */
.bloque { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 22px; align-items: start; }
@media (min-width: 760px) { .bloque { grid-template-columns: 190px 1fr; gap: 20px; } }
.bloque > button { border-radius: 16px; padding: 14px 12px; width: 100%; line-height: 1.25; }
.contenido { min-width: 0; }
.caja { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.caja-t { text-align: center; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
.fila-ex { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.fila-ex:first-of-type { border-top: 0; }
.fila-ex .det { overflow-wrap: anywhere; }
.etq { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; }
.etq.tomado { background: var(--primary-soft); color: var(--primary); }
.etq.pendiente { background: var(--dia); color: #a85d00; border: 1px solid var(--dia-borde); }
@media (prefers-color-scheme: dark) { .etq.pendiente { color: #ffc57a; } }
.fila-ex button.peligro { padding: 4px 8px; font-size: .85rem; }

/* ---------- clínicos ---------- */
.form-cl { border-radius: 14px; padding: 4px 14px 12px; border: 1px solid; transition: background .2s, border-color .2s; }
.form-cl.dia { background: var(--dia); border-color: var(--dia-borde); }
.form-cl.noche { background: var(--noche); border-color: var(--noche-borde); }
.pildora-fila { margin-top: 12px; }
select.pildora {
  width: auto; min-width: 150px; border-radius: 999px; font-weight: 600; padding: 8px 38px 8px 16px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.tabla-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table.tabla-cl { border-collapse: collapse; width: 100%; min-width: 100%; font-size: .92rem; }
.tabla-cl th, .tabla-cl td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; white-space: pre-wrap; min-width: 108px; }
.tabla-cl thead th { text-align: center; font-weight: 700; }
.tabla-cl thead th.dia { background: var(--dia); }
.tabla-cl thead th.noche { background: var(--noche); }
.tabla-cl tbody th { font-weight: 600; color: var(--muted); background: var(--bg); position: sticky; left: 0; min-width: 120px; }
.tabla-cl .x { padding: 0 6px; margin-left: 6px; font-size: .8rem; border-radius: 6px; background: transparent; color: var(--danger); border-color: transparent; }
.tabla-cl .hora { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
.coment-turno { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 14px; }
.coment-turno .t { font-size: .85rem; font-weight: 600; text-align: center; margin-bottom: 4px; }
.coment-turno p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.coment-turno p b { font-weight: 600; }

/* ---------- barra inferior ---------- */
nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
nav a {
  flex: 1; max-width: 320px; text-align: center; text-decoration: none;
  color: var(--muted); padding: 8px 4px 9px; font-size: .78rem; font-weight: 600;
}
nav a .ico { display: block; font-size: 1.35rem; line-height: 1.2; }
nav a.activa { color: var(--primary); }

#aviso {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: #26312c; color: #fff; padding: 10px 18px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 10; max-width: 90vw; text-align: center;
}
#aviso.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <a href="#/ingreso" id="nav-ingreso"><span class="ico">＋</span>Ingreso</a>
  <a href="#/mascotas" id="nav-mascotas"><span class="ico">☰</span>Mascotas</a>
</nav>
<div id="aviso" role="status" aria-live="polite"></div>

<script>
'use strict';

/* =====================================================================
   Base de datos local (IndexedDB): los datos quedan guardados en el teléfono
   ===================================================================== */
const DB_NOMBRE = 'veterinaria';
const STORE = 'mascotas';
let db;

function abrirDB() {
  return new Promise((ok, fallo) => {
    const req = indexedDB.open(DB_NOMBRE, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => fallo(req.error);
  });
}
function tx(modo, fn) {
  return new Promise((ok, fallo) => {
    const t = db.transaction(STORE, modo);
    const res = fn(t.objectStore(STORE));
    t.oncomplete = () => ok(res && 'result' in res ? res.result : undefined);
    t.onerror = () => fallo(t.error);
    t.onabort = () => fallo(t.error);
  });
}
const dbTodas   = () => tx('readonly',  (s) => s.getAll());
const dbAgregar = (m) => tx('readwrite', (s) => s.add(m));
const dbGuardar = (m) => tx('readwrite', (s) => s.put(m));
const dbBorrar  = (id) => tx('readwrite', (s) => s.delete(id));
const dbVaciarYCargar = (lista) => tx('readwrite', (s) => { s.clear(); lista.forEach((m) => s.put(m)); });

/**
 * Deja cada mascota con la forma actual. Las mascotas guardadas con versiones anteriores
 * (que tenían un solo "estado de exámenes" sin fecha) se convierten en un registro de exámenes
 * con la fecha de ingreso, así no se pierde nada.
 */
function normalizarMascota(m) {
  if (!Array.isArray(m.examenes)) {
    const estado = m.estadoExamenes;
    const detalle = (m.examenesPorTomar || '').trim();
    m.examenes = estado && estado !== 'No' && detalle
      ? [{ fecha: m.fechaIngreso, estado, detalle }] : [];
  }
  delete m.estadoExamenes;
  delete m.examenesPorTomar;
  if (!Array.isArray(m.clinicos)) m.clinicos = [];
  m.clinicos.forEach((c) => { if (c.creado == null) c.creado = c.fecha; });
  if (m.peso === undefined) m.peso = null;
  return m;
}

/* Copia en memoria (así compartir es instantáneo, sin esperar a la base de datos) */
let mascotas = [];
async function recargar() {
  mascotas = (await dbTodas()).map(normalizarMascota)
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }));
}

/* =====================================================================
   Utilidades
   ===================================================================== */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function formatearEdad(totalMeses) {
  const anios = Math.floor(totalMeses / 12), meses = totalMeses % 12;
  const tA = anios === 1 ? '1 año' : `${anios} años`;
  const tM = meses === 1 ? '1 mes' : `${meses} meses`;
  if (anios === 0 && meses === 0) return 'Menos de 1 mes';
  if (anios === 0) return tM;
  if (meses === 0) return tA;
  return `${tA} y ${tM}`;
}
const dos = (n) => String(n).padStart(2, '0');
function formatearFecha(ms) {
  const d = new Date(ms);
  return `${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function formatearHora(ms) {
  const d = new Date(ms);
  return `${dos(d.getHours())}:${dos(d.getMinutes())}`;
}
const formatearFechaHora = (ms) => `${formatearFecha(ms)} ${formatearHora(ms)}`;
function aISO(ms) { // millis -> "aaaa-mm-dd" (hora local)
  const d = new Date(ms);
  return `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;
}
function deISO(iso) { // "aaaa-mm-dd" -> millis (mediodía local, para que no se corra de día)
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d, 12, 0).getTime();
}
const minutoActual = () => Math.floor(Date.now() / 60000) * 60000;

function tituloExamenes(estado) {
  if (estado === 'Tomados') return 'Exámenes tomados';
  if (estado === 'Pendientes') return 'Exámenes por tomar';
  return null;
}
const OPCIONES_RESULTADOS = ['Negativo', 'SIDA', 'Leucemia'];
const resultadosATexto = (sel) => OPCIONES_RESULTADOS.filter((o) => sel.includes(o)).join(', ');
const textoAResultados = (t) => (t || '').split(',').map((x) => x.trim()).filter(Boolean);
const textoPeso = (kg) => String(kg).replace('.', ',') + ' kg';

let avisoTimer;
function aviso(texto) {
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.classList.add('ver');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => el.classList.remove('ver'), 2200);
}

/* =====================================================================
   Formulario (sirve para "Nueva mascota" y para "Editar")
   ===================================================================== */
function estadoVacio() {
  return {
    fecha: aISO(Date.now()), nombre: '', especie: '', raza: '', anios: '', meses: '', peso: '',
    motivoIngreso: '', diagnostico: '', infeccioso: false,
    retrovirales: '', resultados: [],
    estadoExamenes: 'No', fechaExamenes: aISO(Date.now()), examenesPorTomar: '',
    ecografia: '', hallazgosEcografia: '',
    enAyuno: false, comentarios: ''
  };
}
function estadoDesde(m) {
  return {
    fecha: aISO(m.fechaIngreso), nombre: m.nombre, especie: m.especie, raza: m.raza ?? '',
    anios: String(Math.floor(m.edad / 12)), meses: String(m.edad % 12),
    peso: m.peso == null ? '' : String(m.peso),
    motivoIngreso: m.motivoIngreso ?? '', diagnostico: m.diagnostico ?? '', infeccioso: !!m.infeccioso,
    retrovirales: m.retrovirales ?? '', resultados: textoAResultados(m.resultadosRetrovirales),
    // Al editar, los exámenes ya registrados se ven en el detalle; aquí se agrega uno nuevo.
    estadoExamenes: 'No', fechaExamenes: aISO(Date.now()), examenesPorTomar: '',
    ecografia: m.ecografia ?? '', hallazgosEcografia: m.hallazgosEcografia ?? '',
    enAyuno: !!m.enAyuno, comentarios: m.comentarios ?? ''
  };
}
function validar(s) {
  const anios = s.anios.trim() === '' ? 0 : Number(s.anios);
  const meses = s.meses.trim() === '' ? 0 : Number(s.meses);
  const aniosOk = Number.isInteger(anios) && anios >= 0;
  const mesesOk = Number.isInteger(meses) && meses >= 0 && meses <= 11;
  const pesoTxt = s.peso.trim();
  const pesoOk = pesoTxt === '' || /^\d+([.,]\d+)?$/.test(pesoTxt);
  const examenesFalta = s.estadoExamenes !== 'No' && s.examenesPorTomar.trim() === '';
  const hallazgosFalta = s.ecografia === 'Sí' && s.hallazgosEcografia.trim() === '';
  const ok = s.nombre.trim() !== '' && s.especie !== '' && aniosOk && mesesOk && pesoOk && !examenesFalta && !hallazgosFalta;
  return { ok, anios, meses, mesesOk, aniosOk, pesoOk, examenesFalta, hallazgosFalta };
}
function aMascota(s, base) {
  const v = validar(s);
  const gato = s.especie === 'Gato';
  const examenes = [...(base.examenes || [])];
  if (s.estadoExamenes !== 'No') {
    examenes.push({ fecha: deISO(s.fechaExamenes || aISO(Date.now())), estado: s.estadoExamenes, detalle: s.examenesPorTomar.trim() });
  }
  return {
    ...base,
    nombre: s.nombre.trim(),
    especie: s.especie,
    raza: s.raza.trim() || null,
    edad: v.anios * 12 + v.meses,
    peso: s.peso.trim() === '' ? null : Number(s.peso.trim().replace(',', '.')),
    motivoIngreso: s.motivoIngreso.trim(),
    diagnostico: s.diagnostico.trim(),
    infeccioso: s.infeccioso,
    retrovirales: gato ? (s.retrovirales || null) : null,
    resultadosRetrovirales: gato && s.retrovirales === 'Sí' ? resultadosATexto(s.resultados) : '',
    examenes,
    clinicos: base.clinicos || [],
    ecografia: s.ecografia || null,
    hallazgosEcografia: s.ecografia === 'Sí' ? s.hallazgosEcografia.trim() : '',
    enAyuno: s.enAyuno,
    comentarios: s.comentarios.trim(),
    fechaIngreso: deISO(s.fecha || aISO(Date.now()))
  };
}

function grupoRadio(k, titulo, opciones, valor) {
  return `<fieldset><legend>${titulo}</legend>${opciones.map((o) =>
    `<label class="opt"><input type="radio" name="${k}" data-radio="${k}" value="${esc(o)}" ${valor === o ? 'checked' : ''}><span>${esc(o)}</span></label>`
  ).join('')}</fieldset>`;
}
function grupoCasillasExclusivo(k, titulo, opciones, valor) {
  return `<fieldset><legend>${titulo}</legend>${opciones.map((o) =>
    `<label class="opt"><input type="checkbox" data-excl="${k}" value="${esc(o)}" ${valor === o ? 'checked' : ''}><span>${esc(o)}</span></label>`
  ).join('')}</fieldset>`;
}
function campoTexto(k, titulo, valor, extra = {}) {
  const { tipo = 'text', area = false, inputmode = '', errId = '', errTexto = '', error = false } = extra;
  const comun = `data-k="${k}" ${error ? 'aria-invalid="true"' : ''}`;
  const control = area
    ? `<textarea ${comun} rows="3">${esc(valor)}</textarea>`
    : `<input type="${tipo}" ${comun} value="${esc(valor)}" ${inputmode ? `inputmode="${inputmode}"` : ''} ${tipo === 'number' ? 'min="0"' : ''} autocomplete="off">`;
  return `<label class="campo"><span>${titulo}</span>${control}${errId ? `<small class="err" id="${errId}" ${error ? '' : 'hidden'}>${errTexto}</small>` : ''}</label>`;
}

function plantillaFormulario(s, modo) {
  const v = validar(s);
  const titExamenes = tituloExamenes(s.estadoExamenes);
  const gato = s.especie === 'Gato';
  return `
    <label class="campo"><span>Fecha de ingreso</span>
      <input type="date" data-k="fecha" value="${esc(s.fecha)}"></label>
    ${campoTexto('nombre', 'Nombre', s.nombre)}
    ${grupoRadio('especie', 'Especie', ['Perro', 'Gato'], s.especie)}
    ${campoTexto('raza', 'Raza (opcional)', s.raza)}
    <div class="fila2">
      ${campoTexto('anios', 'Años', s.anios, { tipo: 'number', inputmode: 'numeric' })}
      ${campoTexto('meses', 'Meses', s.meses, { tipo: 'number', inputmode: 'numeric', errId: 'err-meses', errTexto: 'Máximo 11', error: !v.mesesOk })}
    </div>
    ${campoTexto('peso', 'Peso (kg, opcional)', s.peso, { inputmode: 'decimal', errId: 'err-peso', errTexto: 'Escribe un número, por ejemplo 4,5', error: !v.pesoOk })}
    ${campoTexto('motivoIngreso', 'Motivo de ingreso', s.motivoIngreso)}
    ${campoTexto('diagnostico', 'Diagnóstico', s.diagnostico)}
    <label class="opt" style="margin-top:8px"><input type="checkbox" data-bool="infeccioso" ${s.infeccioso ? 'checked' : ''}><span>Es infeccioso</span></label>

    ${gato ? `
      ${grupoRadio('retrovirales', 'Retrovirales', ['Sí', 'No', 'Pendiente'], s.retrovirales)}
      ${s.retrovirales === 'Sí' ? `
        <div class="sub"><span class="campo" style="margin:6px 0 0"><span style="font-size:.8rem;color:var(--muted);font-weight:600">Resultados (puedes marcar más de uno)</span></span>
        ${OPCIONES_RESULTADOS.map((o) =>
          `<label class="opt"><input type="checkbox" data-res="${o}" ${s.resultados.includes(o) ? 'checked' : ''}><span>${o}</span></label>`).join('')}
        </div>` : ''}
    ` : ''}

    ${grupoRadio('estadoExamenes', 'Exámenes', ['Tomados', 'Pendientes', 'No'], s.estadoExamenes)}
    ${modo === 'editar' ? '<p class="ayuda">Los exámenes ya registrados se ven en el detalle. Aquí puedes agregar uno nuevo.</p>' : ''}
    ${titExamenes ? `
      <label class="campo"><span>${s.estadoExamenes === 'Tomados' ? 'Fecha en que se tomaron' : 'Fecha de los exámenes pendientes'}</span>
        <input type="date" data-k="fechaExamenes" value="${esc(s.fechaExamenes)}"></label>
      ${campoTexto('examenesPorTomar', titExamenes, s.examenesPorTomar, {
        errId: 'err-ex', errTexto: 'Obligatorio si los exámenes están Tomados o Pendientes', error: v.examenesFalta })}` : ''}

    ${grupoCasillasExclusivo('ecografia', 'Ecografía', ['Sí', 'No', 'Pendiente'], s.ecografia)}
    ${s.ecografia === 'Sí' ? campoTexto('hallazgosEcografia', '¿Qué se vio en la ecografía?', s.hallazgosEcografia, {
        area: true, errId: 'err-hall', errTexto: 'Obligatorio si la ecografía es Sí', error: v.hallazgosFalta }) : ''}

    <label class="opt" style="margin-top:8px"><input type="checkbox" data-bool="enAyuno" ${s.enAyuno ? 'checked' : ''}><span>En ayuno</span></label>
    ${campoTexto('comentarios', 'Comentarios extras', s.comentarios, { area: true })}

    <div class="acciones">
      <button type="button" id="btn-guardar" ${v.ok ? '' : 'disabled'}>${modo === 'editar' ? 'Guardar cambios' : 'Guardar'}</button>
      ${modo === 'editar' ? '<button type="button" class="sec" id="btn-cancelar">Cancelar</button>' : ''}
    </div>`;
}

/** Dibuja el formulario dentro de `cont` y conecta todos sus eventos. */
function montarFormulario(cont, s, modo, alGuardar, alCancelar) {
  function dibujar() {
    const y = window.scrollY;
    cont.innerHTML = plantillaFormulario(s, modo);
    window.scrollTo(0, y);
  }
  function refrescarValidacion() {
    const v = validar(s);
    const btn = cont.querySelector('#btn-guardar');
    if (btn) btn.disabled = !v.ok;
    const marca = (id, mostrar, campo) => {
      const e = cont.querySelector('#' + id);
      if (e) e.hidden = !mostrar;
      const c = cont.querySelector(`[data-k="${campo}"]`);
      if (c) mostrar ? c.setAttribute('aria-invalid', 'true') : c.removeAttribute('aria-invalid');
    };
    marca('err-meses', !v.mesesOk, 'meses');
    marca('err-peso', !v.pesoOk, 'peso');
    marca('err-ex', v.examenesFalta, 'examenesPorTomar');
    marca('err-hall', v.hallazgosFalta, 'hallazgosEcografia');
  }

  // Texto, números y fecha: solo actualizan el estado (no redibujan, para no perder el cursor)
  cont.oninput = (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    s[k] = e.target.value;
    refrescarValidacion();
  };
  // Opciones y casillas: pueden mostrar u ocultar secciones, así que redibujan
  cont.onchange = (e) => {
    const t = e.target;
    if (t.dataset.radio) {
      s[t.dataset.radio] = t.value;
      dibujar();
    } else if (t.dataset.excl) {
      s[t.dataset.excl] = t.checked ? t.value : '';
      dibujar();
    } else if (t.dataset.bool) {
      s[t.dataset.bool] = t.checked;
    } else if (t.dataset.res) {
      const op = t.dataset.res;
      if (!t.checked) s.resultados = s.resultados.filter((x) => x !== op);
      else if (op === 'Negativo') s.resultados = ['Negativo'];
      else s.resultados = [...s.resultados.filter((x) => x !== 'Negativo'), op];
      dibujar();
    }
  };
  cont.onclick = (e) => {
    if (e.target.id === 'btn-guardar' && validar(s).ok) alGuardar(s);
    if (e.target.id === 'btn-cancelar') alCancelar();
  };
  dibujar();
  return { dibujar };
}

/* =====================================================================
   Exportación a WhatsApp
   Los clínicos son muchos y crecen cada turno, así que por defecto solo se exportan los
   clínicos NUEVOS desde la última vez que se exportó. Al importar, se agregan a los que
   la otra persona ya tiene. Con la opción "incluir todos" se exportan todos.
   ===================================================================== */
const CLAVE_CORTE = 'vet_ultima_exportacion';
function leerCorte() {
  try { return Number(localStorage.getItem(CLAVE_CORTE)) || 0; } catch { return 0; }
}
function guardarCorte(ms) {
  try { localStorage.setItem(CLAVE_CORTE, String(ms)); } catch { /* sin almacenamiento: se exportará todo la próxima vez */ }
}
const clinicosOrdenados = (m) => [...m.clinicos].sort((a, b) => a.fecha - b.fecha);
const examenesOrdenados = (m) => [...m.examenes].sort((a, b) => a.fecha - b.fecha);

function generarTextoExportacion(todos = false) {
  if (mascotas.length === 0) return 'No hay mascotas registradas.';
  const corte = todos ? 0 : leerCorte();
  const hoy = formatearFecha(Date.now());

  const infecciosos = mascotas.filter((m) => m.infeccioso)
    .sort((a, b) => a.especie.localeCompare(b.especie, 'es'));
  const resto = mascotas.filter((m) => !m.infeccioso);
  const grupos = [
    ['🐱 GATOS', resto.filter((m) => m.especie === 'Gato')],
    ['🐶 PERROS', resto.filter((m) => m.especie === 'Perro')],
    ['⚠ INFECCIOSOS', infecciosos]
  ];

  const L = [];
  L.push(`🐾 MASCOTAS REGISTRADAS (${mascotas.length})`);
  L.push(`Compartido: ${hoy}`);
  L.push('');
  let n = 1;
  for (const [titulo, lista] of grupos) {
    if (lista.length === 0) continue;
    L.push(`${titulo} (${lista.length})`);
    L.push('');
    for (const m of lista) {
      L.push(`${n}. ${m.nombre}`); n++;
      L.push(`   Ingreso: ${formatearFecha(m.fechaIngreso)}`);
      if (m.fechaModificacion != null) L.push(`   Turno: ${hoy}`);
      L.push(`   Especie: ${m.especie}`);
      L.push(`   Raza: ${m.raza ?? 'Sin raza'}`);
      L.push(`   Edad: ${formatearEdad(m.edad)}`);
      if (m.peso != null) L.push(`   Peso: ${textoPeso(m.peso)}`);
      if (m.motivoIngreso) L.push(`   Motivo de ingreso: ${m.motivoIngreso}`);
      if (m.diagnostico) L.push(`   Diagnóstico: ${m.diagnostico}`);
      L.push(`   Infeccioso: ${m.infeccioso ? 'Sí' : 'No'}`);
      if (m.especie === 'Gato') {
        L.push(`   Retrovirales: ${m.retrovirales ?? 'Sin registrar'}`);
        if (m.retrovirales === 'Sí' && m.resultadosRetrovirales) L.push(`   Resultados retrovirales: ${m.resultadosRetrovirales}`);
      }
      if (m.examenes.length === 0) L.push('   Exámenes: No');
      for (const e of examenesOrdenados(m)) {
        L.push(`   ${tituloExamenes(e.estado)} (${formatearFecha(e.fecha)}): ${e.detalle}`);
      }
      L.push(`   Ecografía: ${m.ecografia ?? 'Sin registrar'}`);
      if (m.ecografia === 'Sí' && m.hallazgosEcografia) L.push(`   Hallazgos ecografía: ${m.hallazgosEcografia}`);
      L.push(`   En ayuno: ${m.enAyuno ? 'Sí' : 'No'}`);
      if (m.comentarios) L.push(`   Comentarios: ${m.comentarios}`);
      for (const c of clinicosOrdenados(m).filter((x) => x.creado > corte)) {
        L.push(`   Clínico ${formatearFechaHora(c.fecha)} (${c.turno})`);
        const signos = [];
        if (c.temp) signos.push(`Temp: ${c.temp} °C`);
        if (c.glicemia) signos.push(`Glicemia: ${c.glicemia}`);
        if (c.pas) signos.push(`PAS: ${c.pas}`);
        if (c.pam) signos.push(`PAM: ${c.pam}`);
        if (c.pad) signos.push(`PAD: ${c.pad}`);
        if (signos.length) L.push(`      ${signos.join(' | ')}`);
        if (c.alimentacion.length) L.push(`      Alimentación: ${c.alimentacion.join(', ')}`);
        if (c.orinaDeposiciones) L.push(`      Orina/deposiciones: ${c.orinaDeposiciones}`);
        if (c.comentarios) L.push(`      Comentarios del turno: ${c.comentarios}`);
      }
      L.push('');
    }
  }
  return L.join('\n');
}

const quiereTodos = () => !!(document.getElementById('chk-todos') && document.getElementById('chk-todos').checked);

async function compartirTexto() {
  const ahora = Date.now();
  const texto = generarTextoExportacion(quiereTodos());
  // Primero la hoja de compartir del teléfono (ahí aparece WhatsApp); si no existe, abre WhatsApp directo.
  if (navigator.share) {
    try { await navigator.share({ text: texto }); guardarCorte(ahora); pantallaLista(); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  guardarCorte(ahora);
  window.location.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
}
async function copiarTexto() {
  const ahora = Date.now();
  const texto = generarTextoExportacion(quiereTodos());
  try {
    await navigator.clipboard.writeText(texto);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { /* nada */ }
    ta.remove();
    if (!ok) { aviso('No se pudo copiar'); return; }
  }
  guardarCorte(ahora);
  aviso('Texto copiado');
  pantallaLista();
}

/* =====================================================================
   Importar un mensaje exportado (de esta app o de la versión Android)
   Lee el texto y lo convierte otra vez en mascotas. No usa internet ni servidores.
   ===================================================================== */
const sinAcentos = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

const ETIQUETAS = {
  'ingreso': 'ingreso', 'turno': 'turno', 'especie': 'especie', 'raza': 'raza', 'edad': 'edad', 'peso': 'peso',
  'motivo de ingreso': 'motivo', 'diagnostico': 'diagnostico', 'infeccioso': 'infeccioso',
  'retrovirales': 'retro', 'resultados retrovirales': 'resretro',
  'examenes': 'examenes', 'examenes tomados': 'ex_tomados',
  'examenes por tomar': 'ex_pendientes', 'examenes a tomar': 'ex_pendientes',
  'ecografia': 'eco', 'hallazgos ecografia': 'hallazgos',
  'en ayuno': 'ayuno', 'comentarios': 'comentarios'
};
const ETIQUETAS_CLINICO = {
  'temp': 'temp', 'glicemia': 'glicemia', 'pas': 'pas', 'pam': 'pam', 'pad': 'pad',
  'alimentacion': 'alimentacion', 'orina/deposiciones': 'orina', 'comentarios del turno': 'coment'
};

function fechaDeTexto(t) {
  const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t || '');
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1], 12, 0);
  return d.getMonth() === +m[2] - 1 && d.getDate() === +m[1] ? d.getTime() : null;
}
function edadDeTexto(t) {
  const n = sinAcentos(t);
  if (n.startsWith('menos de')) return 0;
  const a = /(\d+)\s*ano/.exec(n), m = /(\d+)\s*mes/.exec(n);
  return (a ? +a[1] : 0) * 12 + (m ? +m[1] : 0);
}
function pesoDeTexto(t) {
  const m = /(\d+(?:[.,]\d+)?)/.exec(t || '');
  return m ? Number(m[1].replace(',', '.')) : null;
}
function opcionSiNoPendiente(t) {
  const n = sinAcentos(t);
  return n === 'si' ? 'Sí' : n === 'no' ? 'No' : n === 'pendiente' ? 'Pendiente' : null;
}
const esSi = (t) => sinAcentos(t) === 'si';

function parsearMensaje(texto) {
  const lineas = String(texto).replace(/\r/g, '').split('\n')
    .map((l) => l.replace(/[‎‏‪-‮]/g, '').trim());

  // Una mascota empieza con "1. Nombre" y su siguiente línea no vacía es "Ingreso: ..."
  const inicios = [];
  lineas.forEach((l, i) => {
    if (!/^\d+\.\s+\S/.test(l)) return;
    let j = i + 1;
    while (j < lineas.length && lineas[j] === '') j++;
    if (j < lineas.length && sinAcentos(lineas[j]).startsWith('ingreso:')) inicios.push(i);
  });

  const esEncabezado = (l) => /^[^\p{L}\d]*(GATOS|PERROS|INFECCIOSOS)\s*\(\d+\)\s*$/u.test(l);
  const resultado = [];
  let ignoradas = 0;

  inicios.forEach((ini, k) => {
    const fin = k + 1 < inicios.length ? inicios[k + 1] : lineas.length;
    const nombre = lineas[ini].replace(/^\d+\.\s+/, '').trim();
    const c = {};
    const exams = [];
    const clins = [];
    let ref = null;   // campo de texto al que se pegan las líneas siguientes (texto de varias líneas)
    let cur = null;   // clínico que se está leyendo
    let blancos = 0;
    const pegar = (l) => {
      if (ref) ref.o[ref.k] += '\n'.repeat(blancos + 1) + l;
      blancos = 0;
    };

    for (let i = ini + 1; i < fin; i++) {
      const l = lineas[i];
      if (l === '') { if (ref) blancos++; continue; }
      if (esEncabezado(l)) { ref = null; cur = null; blancos = 0; continue; }
      const n = sinAcentos(l);

      // "Clínico 09/11/2026 14:05 (Día)"
      const mh = /^clinico\s+(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*\((dia|noche)\)\s*$/.exec(n);
      if (mh) {
        const f = new Date(+mh[3], +mh[2] - 1, +mh[1], +mh[4], +mh[5], 0, 0).getTime();
        cur = { fecha: f, creado: Date.now(), turno: mh[6] === 'noche' ? 'Noche' : 'Día', temp: '', glicemia: '',
                pas: '', pam: '', pad: '', alimentacion: [], orinaDeposiciones: '', comentarios: '' };
        clins.push(cur); ref = null; blancos = 0;
        continue;
      }
      if (cur) { // dentro de un clínico
        let reconocido = false;
        for (const seg of l.includes('|') ? l.split('|') : [l]) {
          const p = seg.indexOf(':');
          const clave = p > 0 ? ETIQUETAS_CLINICO[sinAcentos(seg.slice(0, p))] : undefined;
          if (!clave) continue;
          reconocido = true;
          const v = seg.slice(p + 1).trim();
          if (['temp', 'glicemia', 'pas', 'pam', 'pad'].includes(clave)) { cur[clave] = v.replace(/\s*°\s*c\s*$/i, '').trim(); ref = null; }
          else if (clave === 'alimentacion') { const nv = sinAcentos(v); cur.alimentacion = ['Boca', 'Sonda'].filter((x) => nv.includes(sinAcentos(x))); ref = null; }
          else if (clave === 'orina') { cur.orinaDeposiciones = v; ref = { o: cur, k: 'orinaDeposiciones' }; }
          else if (clave === 'coment') { cur.comentarios = v; ref = { o: cur, k: 'comentarios' }; }
        }
        if (reconocido) blancos = 0; else pegar(l);
        continue;
      }

      // "Exámenes tomados (09/11/2026): Hemograma"
      const mx = /^(examenes tomados|examenes por tomar)\s*\((\d{1,2}\/\d{1,2}\/\d{4})\)\s*:/.exec(n);
      if (mx) {
        const e = { estado: mx[1] === 'examenes tomados' ? 'Tomados' : 'Pendientes', fecha: fechaDeTexto(mx[2]),
                    detalle: l.slice(l.indexOf(':', l.indexOf(')')) + 1).trim() };
        exams.push(e); ref = { o: e, k: 'detalle' }; blancos = 0;
        continue;
      }
      const p = l.indexOf(':');
      const clave = p > 0 ? ETIQUETAS[sinAcentos(l.slice(0, p))] : undefined;
      if (clave) { c[clave] = l.slice(p + 1).trim(); ref = { o: c, k: clave }; blancos = 0; }
      else pegar(l);
    }

    const especie = (c.especie || '').trim();
    if (!nombre || !especie) { ignoradas++; return; }
    const gato = especie === 'Gato';
    const fechaIngreso = fechaDeTexto(c.ingreso) ?? deISO(aISO(Date.now()));

    // Exámenes: formato con fechas (nuevo) o el formato antiguo ("Exámenes: Tomados" + "Exámenes a tomar: ...")
    let examenes = exams.filter((e) => e.detalle).map((e) => ({ ...e, fecha: e.fecha ?? fechaIngreso }));
    if (exams.length === 0) {
      const exLinea = sinAcentos(c.examenes);
      let estado = 'No';
      if (exLinea === 'tomados') estado = 'Tomados';
      else if (exLinea === 'pendientes') estado = 'Pendientes';
      else if (exLinea === '' && c.ex_tomados !== undefined) estado = 'Tomados';
      else if (exLinea === '' && c.ex_pendientes !== undefined) estado = 'Pendientes';
      const detalle = (c.ex_tomados ?? c.ex_pendientes ?? '').trim();
      if (estado !== 'No' && detalle) examenes = [{ fecha: fechaIngreso, estado, detalle }];
    }

    const retro = gato ? opcionSiNoPendiente(c.retro) : null;
    const eco = opcionSiNoPendiente(c.eco);

    resultado.push({
      nombre, especie,
      raza: c.raza && sinAcentos(c.raza) !== 'sin raza' ? c.raza : null,
      edad: edadDeTexto(c.edad),
      peso: pesoDeTexto(c.peso),
      motivoIngreso: c.motivo || '',
      diagnostico: c.diagnostico || '',
      infeccioso: esSi(c.infeccioso),
      retrovirales: retro,
      resultadosRetrovirales: retro === 'Sí' ? resultadosATexto(textoAResultados(c.resretro)) : '',
      examenes,
      clinicos: clins.sort((a, b) => a.fecha - b.fecha),
      ecografia: eco,
      hallazgosEcografia: eco === 'Sí' ? (c.hallazgos || '') : '',
      enAyuno: esSi(c.ayuno),
      comentarios: c.comentarios || '',
      fechaIngreso,
      fechaModificacion: fechaDeTexto(c.turno)
    });
  });
  return { mascotas: resultado, ignoradas };
}

/** Identifica a una mascota: mismo nombre + misma especie + mismo día de ingreso. */
const claveMascota = (m) => `${sinAcentos(m.nombre)}|${sinAcentos(m.especie)}|${formatearFecha(m.fechaIngreso)}`;
const claveExamen = (e) => `${e.estado}|${formatearFecha(e.fecha)}|${sinAcentos(e.detalle)}`;

/** Si la mascota ya existe, se UNEN los clínicos y exámenes (no se borra nada); si no, se crea. */
async function importarMascotas(lista) {
  const existentes = new Map(mascotas.map((m) => [claveMascota(m), m]));
  let nuevas = 0, actualizadas = 0, clinicosNuevos = 0;
  for (const m of lista) {
    const ya = existentes.get(claveMascota(m));
    if (ya) {
      const porFecha = new Map(ya.clinicos.map((c) => [c.fecha, c]));
      for (const c of m.clinicos) {
        if (!porFecha.has(c.fecha)) clinicosNuevos++;
        porFecha.set(c.fecha, porFecha.get(c.fecha) ? { ...c, creado: porFecha.get(c.fecha).creado } : c);
      }
      const porClave = new Map(ya.examenes.map((e) => [claveExamen(e), e]));
      for (const e of m.examenes) if (!porClave.has(claveExamen(e))) porClave.set(claveExamen(e), e);
      await dbGuardar({
        ...m, id: ya.id, fechaIngreso: ya.fechaIngreso,
        clinicos: [...porFecha.values()].sort((a, b) => a.fecha - b.fecha),
        examenes: [...porClave.values()].sort((a, b) => a.fecha - b.fecha)
      });
      actualizadas++;
    } else {
      await dbAgregar(m);
      nuevas++; clinicosNuevos += m.clinicos.length;
    }
  }
  await recargar();
  return { nuevas, actualizadas, clinicosNuevos };
}

/* =====================================================================
   Respaldo (como los datos viven solo en este teléfono, conviene guardar una copia)
   ===================================================================== */
function descargarRespaldo() {
  const datos = JSON.stringify({ app: 'veterinaria', version: 2, fecha: new Date().toISOString(), mascotas }, null, 2);
  const blob = new Blob([datos], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `veterinaria-respaldo-${aISO(Date.now())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function restaurarRespaldo(archivo) {
  try {
    const json = JSON.parse(await archivo.text());
    if (json.app !== 'veterinaria' || !Array.isArray(json.mascotas)) throw new Error('formato');
    if (!confirm(`Esto reemplaza las ${mascotas.length} mascotas actuales por las ${json.mascotas.length} del respaldo. ¿Continuar?`)) return;
    await dbVaciarYCargar(json.mascotas.map(normalizarMascota));
    await recargar();
    aviso('Respaldo restaurado');
    render();
  } catch {
    alert('El archivo no es un respaldo válido de esta app.');
  }
}

/* =====================================================================
   Pantallas
   ===================================================================== */
const app = document.getElementById('app');
let formIngreso = estadoVacio(); // se conserva si cambias de pestaña y vuelves

function pantallaIngreso() {
  app.innerHTML = '<h1>Nueva mascota</h1><div id="form"></div>';
  montarFormulario(document.getElementById('form'), formIngreso, 'nuevo', async (s) => {
    await dbAgregar(aMascota(s, {}));
    await recargar();
    aviso('Mascota guardada');
    Object.assign(formIngreso, estadoVacio());
    window.scrollTo(0, 0);
    pantallaIngreso();
  });
}

function textoInfoExport() {
  const todos = quiereTodos();
  const corte = leerCorte();
  const total = mascotas.reduce((a, m) => a + m.clinicos.length, 0);
  const nuevos = mascotas.reduce((a, m) => a + m.clinicos.filter((c) => c.creado > corte).length, 0);
  if (todos) return `Se exportarán todos los clínicos (${total}).`;
  return `Se exportarán solo los clínicos nuevos: ${nuevos}` +
    (corte ? ` (desde la última exportación, ${formatearFechaHora(corte)}).` : ' (aún no has exportado).');
}

function pantallaLista() {
  const marcado = quiereTodos();
  const tarjetas = mascotas.map((m) => `
    <div class="tarjeta" data-id="${m.id}">
      <div class="info">
        <div class="nombre">${esc(m.nombre)}</div>
        <div>${esc(m.especie)} · ${esc(m.raza ?? 'Sin raza')} · ${esc(formatearEdad(m.edad))}${m.peso != null ? ' · ' + esc(textoPeso(m.peso)) : ''}</div>
        <div>Ingreso: ${formatearFecha(m.fechaIngreso)}</div>
        ${m.infeccioso ? '<div class="alerta">⚠ Infeccioso</div>' : ''}
        ${m.enAyuno ? '<div class="alerta">⚠ En ayuno</div>' : ''}
        ${m.diagnostico ? `<div>Diagnóstico: ${esc(m.diagnostico)}</div>` : ''}
      </div>
      <button class="peligro" data-borrar="${m.id}">Borrar</button>
    </div>`).join('');

  app.innerHTML = `
    <h1>Mascotas registradas (${mascotas.length})</h1>
    <div class="barra">
      <button id="btn-wsp" ${mascotas.length ? '' : 'disabled'}>Exportar a WhatsApp</button>
      <button id="btn-copiar" class="sec" ${mascotas.length ? '' : 'disabled'}>Copiar texto</button>
      <button id="btn-imp" class="sec">Importar mensaje</button>
    </div>
    <label class="opt opcion-export"><input type="checkbox" id="chk-todos" ${marcado ? 'checked' : ''}><span>Incluir todos los clínicos (no solo los nuevos)</span></label>
    <p class="vacio" id="info-export">${esc(textoInfoExport())}</p>
    <div id="panel-imp"></div>
    ${mascotas.length ? tarjetas : '<p class="vacio">Todavía no hay mascotas. Agrega una en la pestaña Ingreso.</p>'}
    <details class="respaldo">
      <summary>Copia de seguridad</summary>
      <p>Tus datos se guardan solo en este teléfono. Descarga un respaldo de vez en cuando; si cambias de teléfono o se borran los datos del navegador, podrás restaurarlo.</p>
      <div class="acciones" style="margin-top:8px">
        <button class="sec" id="btn-resp-bajar" ${mascotas.length ? '' : 'disabled'}>Descargar respaldo</button>
        <button class="sec" id="btn-resp-subir">Restaurar respaldo</button>
        <input type="file" id="archivo-resp" accept="application/json,.json" hidden>
      </div>
    </details>`;

  document.getElementById('btn-wsp').onclick = compartirTexto;
  document.getElementById('btn-copiar').onclick = copiarTexto;
  document.getElementById('btn-imp').onclick = abrirPanelImportar;
  document.getElementById('chk-todos').onchange = () => {
    document.getElementById('info-export').textContent = textoInfoExport();
  };
  document.getElementById('btn-resp-bajar').onclick = descargarRespaldo;
  const inp = document.getElementById('archivo-resp');
  document.getElementById('btn-resp-subir').onclick = () => inp.click();
  inp.onchange = () => { if (inp.files[0]) restaurarRespaldo(inp.files[0]); inp.value = ''; };

  app.onclick = async (e) => {
    const borrar = e.target.closest('[data-borrar]');
    if (borrar) {
      e.stopPropagation();
      const m = mascotas.find((x) => x.id === Number(borrar.dataset.borrar));
      if (m && confirm(`¿Borrar a ${m.nombre}? Esta acción no se puede deshacer.`)) {
        await dbBorrar(m.id);
        await recargar();
        pantallaLista();
      }
      return;
    }
    const t = e.target.closest('.tarjeta');
    if (t) location.hash = '#/detalle/' + t.dataset.id;
  };
}

function abrirPanelImportar() {
  const panel = document.getElementById('panel-imp');
  panel.innerHTML = `
    <div class="panel">
      <h2>Importar mensaje de WhatsApp</h2>
      <p class="vacio" style="margin:0 0 8px">Copia el mensaje exportado desde WhatsApp (mantén presionado el mensaje → Copiar) y pégalo aquí.</p>
      <textarea id="txt-imp" rows="6" placeholder="Pega aquí el mensaje"></textarea>
      <div class="acciones">
        <button id="btn-rev" disabled>Revisar</button>
        <button id="btn-imp-cerrar" class="txt">Cancelar</button>
      </div>
      <div id="res-imp"></div>
    </div>`;
  const txt = document.getElementById('txt-imp');
  txt.focus();
  txt.oninput = () => (document.getElementById('btn-rev').disabled = txt.value.trim() === '');
  document.getElementById('btn-imp-cerrar').onclick = () => (panel.innerHTML = '');
  document.getElementById('btn-rev').onclick = () => revisarImportacion(txt.value);
}

function revisarImportacion(texto) {
  const res = document.getElementById('res-imp');
  const { mascotas: halladas, ignoradas } = parsearMensaje(texto);
  if (halladas.length === 0) {
    res.innerHTML = '<p class="alerta">No encontré mascotas en ese texto. Revisa que sea el mensaje completo exportado por la app.</p>';
    return;
  }
  const claves = new Set(mascotas.map(claveMascota));
  res.innerHTML = `
    <p style="margin:8px 0 0"><b>Encontré ${halladas.length} mascota${halladas.length === 1 ? '' : 's'}.</b> Marca las que quieres importar:</p>
    <fieldset>${halladas.map((m, i) => `
      <label class="opt"><input type="checkbox" data-imp="${i}" checked>
        <span>${esc(m.nombre)} · ${esc(m.especie)}<br>
        <small>${claves.has(claveMascota(m)) ? 'Ya existe: se actualiza y se agregan los clínicos nuevos' : '<span class="nueva">Nueva</span>'}
        · ${m.clinicos.length} clínico${m.clinicos.length === 1 ? '' : 's'} en el mensaje</small></span></label>`).join('')}
    </fieldset>
    ${ignoradas ? `<p class="alerta">${ignoradas} entrada${ignoradas === 1 ? '' : 's'} no se pudo leer.</p>` : ''}
    <div class="acciones"><button id="btn-imp-ok">Importar seleccionadas</button></div>`;
  const ok = document.getElementById('btn-imp-ok');
  res.onchange = () => (ok.disabled = !res.querySelector('[data-imp]:checked'));
  ok.onclick = async () => {
    const elegidas = [...res.querySelectorAll('[data-imp]:checked')].map((c) => halladas[+c.dataset.imp]);
    const r = await importarMascotas(elegidas);
    aviso(`Importadas: ${r.nuevas} nueva${r.nuevas === 1 ? '' : 's'}, ${r.actualizadas} actualizada${r.actualizadas === 1 ? '' : 's'}, ${r.clinicosNuevos} clínico${r.clinicosNuevos === 1 ? '' : 's'} agregado${r.clinicosNuevos === 1 ? '' : 's'}`);
    pantallaLista();
  };
}

/* ---------------------------------------------------------------------
   Detalle de la mascota
   --------------------------------------------------------------------- */
function dato(titulo, valor) {
  return `<div class="dato"><div class="t">${esc(titulo)}</div><div class="v">${esc(valor)}</div></div>`;
}

// Qué secciones están abiertas (solo mientras estás en esta pantalla) y el clínico que se está escribiendo
let vista = { id: null, ex: false, cl: false, tc: false };
let borrador = null;
const turnoActual = () => { const h = new Date().getHours(); return h >= 7 && h < 20 ? 'Día' : 'Noche'; };
const borradorVacio = () => ({ turno: turnoActual(), temp: '', glicemia: '', pas: '', pam: '', pad: '', boca: false, sonda: false, orina: '', comentarios: '' });
const iconoTurno = (t) => (t === 'Noche' ? '🌙' : '☀');
const borradorValido = (b) => !!(b.temp.trim() || b.glicemia.trim() || b.pas.trim() || b.pam.trim() || b.pad.trim()
  || b.boca || b.sonda || b.orina.trim() || b.comentarios.trim());

function plantillaListaExamenes(m) {
  const lista = examenesOrdenados(m);
  if (lista.length === 0) return '<div class="caja"><div class="caja-t">Exámenes</div><p class="vacio" style="margin:6px 0">Sin exámenes registrados.</p></div>';
  return `<div class="caja"><div class="caja-t">Exámenes</div>${lista.map((e, i) => `
    <div class="fila-ex">
      <span>${formatearFecha(e.fecha)}</span>
      <span class="det"><span class="etq ${e.estado === 'Tomados' ? 'tomado' : 'pendiente'}">${e.estado === 'Tomados' ? 'Tomado' : 'Pendiente'}</span>${esc(e.detalle)}</span>
      <button class="peligro" data-quitar-ex="${i}" aria-label="Quitar examen">Quitar</button>
    </div>`).join('')}</div>`;
}

function plantillaFormClinico(b) {
  const noche = b.turno === 'Noche';
  const num = (k, tit) => `<label class="campo"><span>${tit}</span><input type="text" inputmode="decimal" data-c="${k}" value="${esc(b[k])}" autocomplete="off"></label>`;
  return `
    <div class="form-cl ${noche ? 'noche' : 'dia'}" id="form-cl">
      <div class="pildora-fila">
        <select class="pildora" id="sel-turno" aria-label="Turno: día o noche">
          <option value="Día" ${noche ? '' : 'selected'}>☀ Día</option>
          <option value="Noche" ${noche ? 'selected' : ''}>🌙 Noche</option>
        </select>
      </div>
      <div class="fila2">${num('temp', 'Temp °C')}${num('glicemia', 'Glicemia')}</div>
      <fieldset><legend>Presiones</legend>
        <div class="fila3">${num('pas', 'PAS')}${num('pam', 'PAM')}${num('pad', 'PAD')}</div>
      </fieldset>
      <fieldset><legend>Alimentación</legend>
        <label class="opt"><input type="checkbox" data-cb="boca" ${b.boca ? 'checked' : ''}><span>Por boca</span></label>
        <label class="opt"><input type="checkbox" data-cb="sonda" ${b.sonda ? 'checked' : ''}><span>Por sonda</span></label>
      </fieldset>
      <label class="campo"><span>Orina / deposiciones</span><input type="text" data-c="orina" value="${esc(b.orina)}" autocomplete="off"></label>
      <label class="campo"><span>Comentarios del turno</span><textarea data-c="comentarios" rows="3">${esc(b.comentarios)}</textarea></label>
      <div class="acciones"><button id="btn-guardar-cl" ${borradorValido(b) ? '' : 'disabled'}>Guardar clínico</button></div>
    </div>`;
}

function plantillaTablaClinicos(m) {
  const lista = clinicosOrdenados(m);
  if (lista.length === 0) return '<div class="caja"><p class="vacio" style="margin:4px 0">Todavía no hay clínicos registrados.</p></div>';
  const celda = (v) => (v ? esc(v) : '—');
  const filas = [
    ['Temp °C', (c) => c.temp], ['Glicemia', (c) => c.glicemia],
    ['PAS', (c) => c.pas], ['PAM', (c) => c.pam], ['PAD', (c) => c.pad],
    ['Alimentación', (c) => c.alimentacion.map((a) => 'Por ' + a.toLowerCase()).join(', ')],
    ['Orina / deposiciones', (c) => c.orinaDeposiciones]
  ];
  const conComentario = lista.filter((c) => c.comentarios);
  return `
    <div class="tabla-scroll"><table class="tabla-cl">
      <thead><tr><th></th>${lista.map((c) => `
        <th class="${c.turno === 'Noche' ? 'noche' : 'dia'}">${iconoTurno(c.turno)} ${formatearFecha(c.fecha)}<span class="hora">${formatearHora(c.fecha)} · ${c.turno}
          <button class="x" data-quitar-cl="${c.fecha}" aria-label="Borrar este clínico">✕</button></span></th>`).join('')}</tr></thead>
      <tbody>${filas.map(([t, f]) => `<tr><th scope="row">${t}</th>${lista.map((c) => `<td>${celda(f(c))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="coment-turno"><div class="t">Comentarios del turno</div>
      ${conComentario.length ? conComentario.map((c) => `<p><b>${formatearFecha(c.fecha)} ${formatearHora(c.fecha)} ${iconoTurno(c.turno)}:</b> ${esc(c.comentarios)}</p>`).join('')
        : '<p class="vacio" style="text-align:center">Sin comentarios.</p>'}
    </div>`;
}

function pantallaDetalle(id) {
  const m = mascotas.find((x) => x.id === id);
  if (!m) {
    app.innerHTML = '<p><button class="txt" id="volver">← Volver</button></p><p>Mascota no encontrada</p>';
    document.getElementById('volver').onclick = () => (location.hash = '#/mascotas');
    return;
  }
  if (vista.id !== id) { vista = { id, ex: false, cl: false, tc: false }; borrador = borradorVacio(); }
  if (!borrador) borrador = borradorVacio();

  app.innerHTML = `
    <p style="margin:0 0 8px"><button class="txt" id="volver">← Volver</button></p>
    <section class="cuadro">
      <div class="cuadro-cab"><h1>${esc(m.nombre)}</h1><button id="btn-editar">Editar</button></div>
      <div class="datos">
        ${dato('Fecha de ingreso', formatearFecha(m.fechaIngreso))}
        ${dato('Especie', m.especie)}
        ${dato('Raza', m.raza ?? 'Sin raza')}
        ${dato('Edad', formatearEdad(m.edad))}
        ${dato('Peso', m.peso != null ? textoPeso(m.peso) : 'Sin registrar')}
        ${m.motivoIngreso ? dato('Motivo de ingreso', m.motivoIngreso) : ''}
        ${dato('Diagnóstico', m.diagnostico || 'Sin diagnóstico')}
        ${dato('Infeccioso', m.infeccioso ? 'Sí' : 'No')}
        ${m.especie === 'Gato' ? dato('Retrovirales', m.retrovirales ?? 'Sin registrar') : ''}
        ${m.especie === 'Gato' && m.retrovirales === 'Sí' && m.resultadosRetrovirales ? dato('Resultados retrovirales', m.resultadosRetrovirales) : ''}
        ${dato('Ecografía', m.ecografia ?? 'Sin registrar')}
        ${m.ecografia === 'Sí' && m.hallazgosEcografia ? dato('Hallazgos de la ecografía', m.hallazgosEcografia) : ''}
        ${dato('En ayuno', m.enAyuno ? 'Sí' : 'No')}
        ${m.comentarios ? dato('Comentarios', m.comentarios) : ''}
      </div>
    </section>

    <div class="bloque">
      <button class="sec" id="tg-ex" aria-expanded="${vista.ex}">${vista.ex ? 'Ocultar lista de exámenes' : 'Mostrar lista de exámenes'}</button>
      <div class="contenido">${vista.ex ? plantillaListaExamenes(m) : ''}</div>
    </div>

    <div class="bloque">
      <button class="sec" id="tg-cl" aria-expanded="${vista.cl}">${vista.cl ? 'Ocultar ingreso de clínicos' : 'Ingresar clínicos'}</button>
      <div class="contenido">${vista.cl ? plantillaFormClinico(borrador) : ''}</div>
    </div>

    <div class="bloque">
      <button class="sec" id="tg-tc" aria-expanded="${vista.tc}">${vista.tc ? 'Ocultar todos los clínicos' : 'Mostrar todos los clínicos'}</button>
      <div class="contenido">${vista.tc ? plantillaTablaClinicos(m) : ''}</div>
    </div>`;

  const redibujar = () => { const y = window.scrollY; pantallaDetalle(id); window.scrollTo(0, y); };
  const actualizarBoton = () => { const b = document.getElementById('btn-guardar-cl'); if (b) b.disabled = !borradorValido(borrador); };

  app.oninput = (e) => {
    const k = e.target.dataset.c;
    if (!k) return;
    borrador[k] = e.target.value;
    actualizarBoton();
  };
  app.onchange = (e) => {
    const t = e.target;
    if (t.id === 'sel-turno') {
      borrador.turno = t.value;
      const f = document.getElementById('form-cl');
      f.classList.toggle('noche', t.value === 'Noche');
      f.classList.toggle('dia', t.value !== 'Noche');
    } else if (t.dataset.cb) {
      borrador[t.dataset.cb] = t.checked;
      actualizarBoton();
    }
  };
  app.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'volver') { history.length > 1 ? history.back() : (location.hash = '#/mascotas'); return; }
    if (b.id === 'btn-editar') { location.hash = '#/editar/' + id; return; }
    if (b.id === 'tg-ex') { vista.ex = !vista.ex; redibujar(); return; }
    if (b.id === 'tg-cl') { vista.cl = !vista.cl; redibujar(); return; }
    if (b.id === 'tg-tc') { vista.tc = !vista.tc; redibujar(); return; }

    if (b.id === 'btn-guardar-cl' && borradorValido(borrador)) {
      let fecha = minutoActual();
      while (m.clinicos.some((c) => c.fecha === fecha)) fecha += 60000; // dos clínicos en el mismo minuto: el segundo queda 1 min después
      const nuevo = {
        fecha, creado: Date.now(), turno: borrador.turno,
        temp: borrador.temp.trim(), glicemia: borrador.glicemia.trim(),
        pas: borrador.pas.trim(), pam: borrador.pam.trim(), pad: borrador.pad.trim(),
        alimentacion: [borrador.boca ? 'Boca' : null, borrador.sonda ? 'Sonda' : null].filter(Boolean),
        orinaDeposiciones: borrador.orina.trim(), comentarios: borrador.comentarios.trim()
      };
      await dbGuardar({ ...m, clinicos: [...m.clinicos, nuevo].sort((x, y) => x.fecha - y.fecha), fechaModificacion: Date.now() });
      await recargar();
      borrador = borradorVacio();
      vista.tc = true;
      aviso('Clínico guardado');
      redibujar();
      return;
    }
    if (b.dataset.quitarEx !== undefined) {
      const e1 = examenesOrdenados(m)[Number(b.dataset.quitarEx)];
      if (e1 && confirm('¿Quitar este examen de la lista?')) {
        await dbGuardar({ ...m, examenes: m.examenes.filter((x) => x !== m.examenes.find((y) => claveExamen(y) === claveExamen(e1))) });
        await recargar(); redibujar();
      }
      return;
    }
    if (b.dataset.quitarCl !== undefined) {
      const f = Number(b.dataset.quitarCl);
      if (confirm('¿Borrar este clínico? Esta acción no se puede deshacer.')) {
        await dbGuardar({ ...m, clinicos: m.clinicos.filter((c) => c.fecha !== f) });
        await recargar(); redibujar();
      }
    }
  };
}

function pantallaEditar(id) {
  const m = mascotas.find((x) => x.id === id);
  if (!m) { location.hash = '#/mascotas'; return; }
  app.innerHTML = '<h1>Editar mascota</h1><div id="form"></div>';
  const s = estadoDesde(m);
  montarFormulario(document.getElementById('form'), s, 'editar', async (est) => {
    await dbGuardar({ ...aMascota(est, m), id: m.id, fechaModificacion: Date.now() });
    await recargar();
    aviso('Cambios guardados');
    location.replace('#/detalle/' + id);
  }, () => history.back());
}

/* =====================================================================
   Navegación (con #, así el botón "atrás" del teléfono funciona)
   ===================================================================== */
function render() {
  const ruta = location.hash || '#/ingreso';
  const partes = ruta.split('/'); // ["#", "detalle", "3"]
  const seccion = partes[1];
  app.onclick = null; app.oninput = null; app.onchange = null;

  document.getElementById('nav-ingreso').classList.toggle('activa', seccion === 'ingreso');
  document.getElementById('nav-mascotas').classList.toggle('activa', seccion !== 'ingreso');

  if (seccion === 'mascotas') pantallaLista();
  else if (seccion === 'detalle') pantallaDetalle(Number(partes[2]));
  else if (seccion === 'editar') pantallaEditar(Number(partes[2]));
  else pantallaIngreso();
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

/* =====================================================================
   Inicio
   ===================================================================== */
(async function iniciar() {
  try {
    db = await abrirDB();
    await recargar();
    // Pide al navegador que no borre los datos si hay poco espacio
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    app.innerHTML = '<h1>No se pudo abrir la base de datos</h1><p>Prueba abrir la app en una ventana normal (no privada) del navegador.</p>';
    return;
  }
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
